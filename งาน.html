<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Expense Tracker</title>
    <style>
        /* ส่วนที่ 1: ตกแต่งความสวยงาม (CSS) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 5px; }
        .balance {
            font-size: 40px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-income { background-color: #4CAF50; } /* สีเขียว */
        .btn-expense { background-color: #f44336; } /* สีแดง */
        
        /* ส่วนแสดงประวัติ */
        .history-list {
            list-style-type: none;
            padding: 0;
            margin-top: 20px;
            text-align: left;
        }
        .history-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
        .text-green { color: #4CAF50; font-weight: bold; }
        .text-red { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>กระเป๋าตังค์มินิมอล</h2>
        <p>ยอดเงินคงเหลือ</p>
        <div class="balance" id="balanceDisplay">0 ฿</div>

        <div class="input-group">
            <input type="number" id="amountInput" placeholder="จำนวนเงิน (บาท)" min="1">
            <input type="text" id="descInput" placeholder="คำอธิบาย (เช่น ค่าข้าว, ค่าชีท)">
        </div>

        <div class="button-group">
            <button class="btn-income" onclick="addTransaction('income')">+ รายรับ</button>
            <button class="btn-expense" onclick="addTransaction('expense')">- รายจ่าย</button>
        </div>

        <ul class="history-list" id="historyList">
            </ul>
    </div>

    <script>
        // ส่วนที่ 2: โลจิกการทำงานของแอป (JavaScript)

        // 1. ประกาศตัวแปรเก็บยอดเงินเริ่มต้น
        let currentBalance = 0; 

        // 2. ฟังก์ชันหลักสำหรับรับค่าและคำนวณ
        function addTransaction(type) {
            // ดึงข้อมูลจากช่องกรอก
            const amountText = document.getElementById('amountInput').value;
            const desc = document.getElementById('descInput').value;
            
            // แปลงค่าเงินจากตัวอักษรเป็นตัวเลข
            const amount = parseFloat(amountText);

            // ตรวจสอบความถูกต้อง (ดัก Error)
            if (isNaN(amount) || amount <= 0) {
                alert("กรุณาใส่จำนวนเงินให้ถูกต้องครับ!");
                return; // หยุดการทำงานถ้าข้อมูลผิด
            }
            if (desc.trim() === "") {
                alert("กรุณาใส่คำอธิบายด้วยครับ!");
                return;
            }

            // คำนวณยอดเงินตามประเภทปุ่มที่กด
            let historyHTML = "";
            if (type === 'income') {
                currentBalance = currentBalance + amount;
                historyHTML = `<li class="history-item">
                                  <span>${desc}</span>
                                  <span class="text-green">+${amount} ฿</span>
                               </li>`;
            } else if (type === 'expense') {
                currentBalance = currentBalance - amount;
                historyHTML = `<li class="history-item">
                                  <span>${desc}</span>
                                  <span class="text-red">-${amount} ฿</span>
                               </li>`;
            }

            // 3. อัปเดตหน้าจอแสดงผล
            document.getElementById('balanceDisplay').innerText = currentBalance + " ฿";
            
            // เพิ่มประวัติลงใน List ด้านล่างสุด (เอาอันใหม่ไว้บนสุด)
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = historyHTML + historyList.innerHTML;

            // ล้างช่องกรอกข้อมูลให้ว่างเปล่าเพื่อรอรับค่าใหม่
            document.getElementById('amountInput').value = "";
            document.getElementById('descInput').value = "";
        }
    </script>

</body>
</html>
